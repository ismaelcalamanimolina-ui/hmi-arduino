<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HMI Arduino USB</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 30px; background: #121212; color: white; }
    h1 { font-size: 24px; margin-bottom: 20px; }
    .btn { padding: 18px 25px; font-size: 18px; font-weight: bold; margin: 10px auto; border-radius: 10px; border: none; cursor: pointer; display: block; width: 85%; max-width: 320px; }
    .btn-connect { background-color: #007bff; color: white; }
    .btn-toggle { background-color: #28a745; color: white; }
  </style>
  <!-- Cargamos el Polyfill de WebUSB Serial para Android -->
  <script src="https://cdn.jsdelivr.net/gh/webusb/arduino/library/WebUSB.js"></script>
</head>
<body>

  <h1>HMI Arduino - Control LED</h1>
  
  <button class="btn btn-connect" onclick="conectarUSB()">1. CONECTAR USB</button>
  <button id="btnLed" class="btn btn-toggle" onclick="alternarLED()">2. ENCENDER / APAGAR</button>

  <script>
    let port;
    let estadoLed = false;

    async function conectarUSB() {
      try {
        if ('serial' in navigator) {
          // Si el navegador soporta Web Serial (PC)
          port = await navigator.serial.requestPort();
          await port.open({ baudRate: 9600 });
        } else if ('usb' in navigator) {
          // Si está en celular Android (WebUSB)
          const device = await navigator.usb.requestDevice({ filters: [] });
          await device.open();
          await device.selectConfiguration(1);
          await device.claimInterface(0);
          port = device;
        } else {
          alert("Tu navegador no soporta comunicaciones USB/Serial.");
          return;
        }

        alert("¡Arduino Conectado con éxito!");
      } catch (err) {
        alert("Error al conectar: " + err.message);
      }
    }

    async function alternarLED() {
      if (!port) {
        alert("Primero presiona '1. CONECTAR USB'");
        return;
      }

      estadoLed = !estadoLed;
      const comando = estadoLed ? "1" : "0";
      const data = new TextEncoder().encode(comando);

      try {
        if ('serial' in navigator && port.writable) {
          const writer = port.writable.getWriter();
          await writer.write(comando);
          writer.releaseLock();
        } else if (port.transferOut) {
          // Envío directo vía WebUSB (Endpoint 1 o 2 en Android)
          await port.transferOut(1, data);
        }

        document.getElementById("btnLed").innerText = estadoLed ? "APAGAR LED" : "ENCENDER LED";
        document.getElementById("btnLed").style.backgroundColor = estadoLed ? "#dc3545" : "#28a745";
      } catch (err) {
        alert("Error al enviar comando: " + err.message);
      }
    }
  </script>
</body>
</html>
